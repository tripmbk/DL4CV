<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pham Minh Tri & Nguyen Nhut Tan - Profile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98)), 
                              url('https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=1965&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .tech-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Hiệu ứng kính mờ (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-slate-700 py-10 px-4">

    <!-- MAIN CONTAINER -->
    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-sm overflow-hidden border border-gray-200">
        
        <!-- HEADER PROFILE SECTION -->
        <div class="bg-[#3b82f6] p-8 md:p-10 flex flex-col md:flex-row items-center gap-8">
            <!-- Avatar Frame -->
            <div class="w-48 h-48 bg-white p-2 rounded-sm shrink-0 shadow-sm">
                <div class="w-full h-full bg-slate-200 overflow-hidden">
                    <!-- Thay link ảnh avatar của bạn vào src dưới đây -->
                    <img src="https://via.placeholder.com/200" alt="Profile Picture" class="w-full h-full object-cover">
                </div>
            </div>
            
            <!-- Profile Info -->
            <div class="text-white text-center md:text-left space-y-3">
                <h1 class="text-2xl md:text-4xl font-bold tracking-wide">Pham Minh Tri & Nguyen Nhut Tan</h1>
                <div class="text-xs md:text-sm font-light space-y-1.5 opacity-90">
                    <p class="font-medium">CO5085</p>
                    <p>Ho Chi Minh University of Technology (HCMUT)</p>
                </div>
                
                <!-- Resource Badges / Buttons -->
                <div class="flex flex-wrap justify-center md:justify-start gap-2 pt-2">
                    <a href="#" class="px-4 py-1 bg-white text-slate-800 text-xs font-medium rounded-full shadow-sm hover:bg-gray-100 transition-colors">Exercise</a>
                    <a href="#" class="px-4 py-1 bg-[#86efac] text-emerald-900 text-xs font-medium rounded-full shadow-sm hover:bg-[#6ee7b7] transition-colors">Assignment</a>
                </div>
            </div>
        </div>

        <!-- CONTENT CONTAINER -->
        <div class="divide-y divide-gray-100">
            
            <!-- BIO SECTION -->
            <section class="p-8 md:p-10 space-y-4">
                <h2 class="text-xl font-bold text-slate-800 tracking-wide uppercase border-b border-gray-100 pb-2">BIO</h2>
                <p class="text-sm text-slate-600 leading-relaxed text-justify">
                    Pham Minh Tri and Nguyen Nhut Tan are both PhD Candidates at the Ho Chi Minh University of Technology (HCMUT).
                </p>
            </section>

        </div>
    </div>

</body>
</html>
